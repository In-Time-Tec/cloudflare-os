<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevents Gadget UI frames from navigating away from their srcdoc. DO NOT REMOVE. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src srcdoc:;">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cloudflare OS</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #e5eae1; }
      html[data-mode="dark"], html[data-mode="dark"] body, html[data-mode="dark"] #root { background: #0b0d0b; }
    </style>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('gadgets:theme-mode');
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
