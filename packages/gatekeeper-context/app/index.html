<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; worker-src 'none'; child-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
    <title>Context Library</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: var(--color-kumo-base, #fffdfb); }
      html[data-mode="dark"], html[data-mode="dark"] body, html[data-mode="dark"] #root {
        background: var(--color-kumo-base, #0e1516);
      }
    </style>
    <script>
      if (!document.documentElement.dataset.mode) {
        document.documentElement.setAttribute(
          'data-mode',
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
        )
      }
      document.documentElement.style.colorScheme = document.documentElement.dataset.mode
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
