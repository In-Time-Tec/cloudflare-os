name: Deploy workers.dev

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-dev-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "24.19.0"

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "true"
      NO_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy 2>&1 | tee deploy.log

      - name: Verify deployment
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          url="$(sed $'s/\033\[[0-9;]*m//g' deploy.log \
            | grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' \
            | tail -1)"
          if [[ -z "$url" ]]; then
            echo "Wrangler did not report a workers.dev URL." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "$url/" > /tmp/cloudflare-os-index.html
          grep -qi '<!doctype html' /tmp/cloudflare-os-index.html
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare OS deployed"
            echo
            echo "[$url]($url)"
            echo
            echo "Source commit: \`$SOURCE_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"
